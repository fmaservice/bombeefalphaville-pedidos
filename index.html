<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2a1a17;--mute:#7a6a64;--red:#9b1c1c;--line:#eadfd6;--wa:#1faa59;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1211;--card:#261a18;--ink:#f5ebe4;--mute:#b3a199;--red:#e0584f;--line:#3a2a27}}
:root[data-theme="dark"]{--bg:#1a1211;--card:#261a18;--ink:#f5ebe4;--mute:#b3a199;--red:#e0584f;--line:#3a2a27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
header{padding:28px 20px 12px;text-align:center}
header h1{margin:0;font-size:28px;letter-spacing:.5px}
header p{margin:6px 0 0;color:var(--mute);font-family:system-ui,sans-serif;font-size:14px}
main{max-width:720px;margin:0 auto;padding:8px 16px;display:grid;gap:14px}
h2{font-size:15px;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:var(--red);margin:14px 4px 0}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;align-items:center}
.card.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.ph{flex:0 0 120px;height:150px;border-radius:12px;background:linear-gradient(135deg,#f3e9df,#e6d6c8);display:flex;align-items:center;justify-content:center;overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph{background:linear-gradient(135deg,#3a2a27,#2f211f)}}
.ph svg{width:100%;height:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0;font-family:system-ui,sans-serif}
.info b{display:block;font-family:Georgia,serif;font-size:17px;line-height:1.2}
.tag{display:inline-block;font-size:11px;margin-top:4px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mute)}
.tag.p{background:#1d1d1d;color:#e8c27a}
.price{margin-top:6px;font-size:18px;font-weight:700;color:var(--red)}
.price small{font-weight:400;color:var(--mute);font-size:12px}
.step{display:flex;align-items:center;gap:10px;margin-top:8px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.step button.plus{background:var(--red);color:#fff;border-color:var(--red)}
.step span{min-width:56px;text-align:center;font-weight:600;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;justify-content:center}
.bar .t{font-family:system-ui,sans-serif;font-size:13px;color:var(--mute)}
.bar .t b{display:block;font-size:18px;color:var(--ink)}
.wa{flex:1;max-width:320px;text-align:center;padding:14px;border-radius:12px;background:var(--wa);color:#fff;font:700 16px system-ui,sans-serif;text-decoration:none}
.wa.off{background:#8a8a8a;pointer-events:none;opacity:.7}
.note{font:12px system-ui,sans-serif;color:var(--mute);text-align:center;padding:8px 20px}
@media(max-width:420px){.ph{flex-basis:100px;height:125px}}
</style>

var Q={};
function brl(v){return "R$ "+v.toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+,)/g,".")}
function kg(q){return q.toFixed(1).replace(".",",")+" kg"}
function art(k,prem){
 var m=prem?"#c0475a":"#a83a3a", f=prem?"#f6e9dd":"#efe0cf", d=prem?"#8c2c40":"#7d2a2a";
 var veins=prem?'<path d="M40 70 q20-14 40-4 M55 50 q25-10 45 2 M50 88 q30-10 55 2" stroke="#f3d9d6" stroke-width="2.2" fill="none" opacity=".75"/>':'<path d="M55 70 q20-8 40-2" stroke="#f3d9d6" stroke-width="1.4" fill="none" opacity=".4"/>';
 if(k=="picanha")return '<svg viewBox="0 0 160 120"><ellipse cx="80" cy="108" rx="62" ry="6" fill="#000" opacity=".12"/><path d="M18 92 Q14 40 70 24 Q132 16 146 82 Q148 100 120 100 L36 102 Q20 102 18 92Z" fill="'+f+'"/><path d="M26 94 Q26 52 72 38 Q122 32 136 84 Q138 94 116 94 L40 96 Q28 96 26 94Z" fill="'+m+'"/><path d="M26 94 Q26 52 72 38 Q122 32 136 84" fill="none" stroke="'+d+'" stroke-width="2"/>'+veins+'</svg>';
 return '<svg viewBox="0 0 160 120"><ellipse cx="80" cy="106" rx="64" ry="6" fill="#000" opacity=".12"/><path d="M10 78 Q10 40 50 36 L120 34 Q152 38 150 70 Q148 98 112 98 L44 98 Q10 98 10 78Z" fill="'+f+'"/><path d="M18 78 Q20 48 54 45 L118 44 Q140 46 140 68 Q138 88 110 88 L46 89 Q18 88 18 78Z" fill="'+m+'"/><path d="M18 78 Q20 48 54 45 L118 44" fill="none" stroke="'+d+'" stroke-width="2"/>'+veins+'</svg>';
}
function render(){
 var h="",last="";
 P.forEach(function(p){
  if(p.g!=last){h+="<h2>"+p.g+"</h2>";last=p.g}
  var q=Q[p.id]||0;
  h+='<div class="card'+(q?" sel":"")+'"><div class="ph">'+(IMG[p.id]?'<img alt="'+p.n+'" src="'+IMG[p.id]+'">':art(p.k,p.prem))+'</div><div class="info"><b>'+p.n+'</b><span class="tag'+(p.prem?" p":"")+'">'+p.t+'</span><div class="price">'+brl(p.pr)+' <small>/ kg</small></div><div class="step"><button onclick="ch(\''+p.id+'\',-0.5)" aria-label="Diminuir">−</button><span>'+(q?kg(q):"0 kg")+'</span><button class="plus" onclick="ch(\''+p.id+'\',0.5)" aria-label="Aumentar">+</button></div></div></div>';
 });
 document.getElementById("list").innerHTML=h;
 var tot=0,lines=[];
 P.forEach(function(p){var q=Q[p.id]||0;if(q){tot+=q*p.pr;lines.push("• "+kg(q)+" – "+p.n+" ("+brl(q*p.pr)+")")}});
 document.getElementById("total").textContent=brl(tot);
 var a=document.getElementById("wa");
 if(lines.length){
  var msg="Olá, Bom Beef Alphaville! Gostaria de fazer um pedido:\n\n"+lines.join("\n")+"\n\nTotal estimado: "+brl(tot)+"\n\nPodem confirmar a disponibilidade?";
  a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg);a.className="wa";
 }else{a.href="#";a.className="wa off"}
}
function ch(id,d){Q[id]=Math.max(0,Math.min(20,(Q[id]||0)+d));render()}
render();
</script>
